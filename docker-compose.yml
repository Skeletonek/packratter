services:
  packratter:
    image: registry.gitlab.com/skeletonek/packratter:latest
    container_name: packratter
    ports:
      - '5000:5000'
    volumes:
      - ./data:/data
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATA_DIR=/data
      - GPG_ROOT=/data/keys/gnupg
