# pnpm 11 auto-verifies node_modules before every script run. Inside the dev
# container the store path always computes differently than on the host, so the
# check would purge/reinstall the mounted node_modules (see docker-compose.dev.yml).
verifyDepsBeforeRun: false

allowBuilds:
  argon2: true
  esbuild: true
  '@parcel/watcher': true
minimumReleaseAgeExclude:
  - '@vitest/mocker@5.0.4'
  - '@vitest/spy@5.0.4'
  - vitest@5.0.4
  - zod@4.6.6
