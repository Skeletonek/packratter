# Runs only for version tags (X.Y.Z): build the container image, smoke-test it,
# publish to the GitLab Container Registry, then create a GitLab Release whose
# notes are extracted from CHANGELOG.md for that version.
workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/

stages:
  - publish
  - release

publish:
  stage: publish
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: '/certs'
  rules:
    - if: $CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/
  script:
    # CI_JOB_TOKEN auth to the registry — no secrets to configure.
    - echo -n "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG" -t "$CI_REGISTRY_IMAGE:latest" .
    # The built image must boot and answer /healthz before it is published.
    - |
      docker run -d --name smoke -e ADMIN_USER=ci -e ADMIN_PASS=ci-smoke-secret "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
      ok=0
      for i in $(seq 1 60); do
        if docker exec smoke curl -fsS -o /dev/null http://127.0.0.1:8080/healthz; then ok=1; break; fi
        sleep 1
      done
      if [ "$ok" != 1 ]; then docker logs smoke; echo "smoke test failed"; exit 1; fi
      docker rm -f smoke
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
    - docker push "$CI_REGISTRY_IMAGE:latest"

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: 'true'
  needs:
    - publish
  rules:
    - if: $CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/
  script:
    # Fails the release (and the pipeline) when CHANGELOG.md lacks this version.
    - sh scripts/release-notes.sh "$CI_COMMIT_TAG" > release_notes.md
    - |
      glab release create "$CI_COMMIT_TAG" \
        --name "Packratter $CI_COMMIT_TAG" \
        --notes-file release_notes.md \
        --assets-links "[
          {\"name\": \"Container image\", \"url\": \"$CI_PROJECT_URL/container_registry\"},
          {\"name\": \"Installation guide\", \"url\": \"$CI_PROJECT_URL/-/blob/master/docs/install.md\"}
        ]"
